name: Apply review fixes

on:
  pull_request:
    branches:
      - fix/remove-pnpm-lockfile
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out fix branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm

      - name: Apply reviewed fixes
        run: |
          python3 scripts/apply-review-fixes.py
          git checkout HEAD -- scripts/apply-review-fixes.py .github/workflows/apply-review-fixes.yml

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Capture API test output
        run: |
          set +e
          pnpm --filter @workspace/api-server test 2>&1 | tee artifacts/review-api-test.log
          echo "${PIPESTATUS[0]}" > artifacts/review-api-test.exit-code
          exit 0

      - name: Commit applied patch and diagnostics
        run: |
          rm -f pnpm-lock.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: capture review fix diagnostics [skip ci]"
          git push origin HEAD
