name: Apply review fixes

on:
  pull_request:
    branches:
      - fix/remove-pnpm-lockfile
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out fix branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm

      - name: Apply reviewed fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          script = Path("scripts/apply-review-fixes.py")
          text = script.read_text(encoding="utf-8")
          marker = "# Encode route params in the generated metadata fetcher too."
          if marker in text:
              start = text.index(marker)
              end = text.index("# Self-remove the one-shot automation files before committing.", start)
              script.write_text(text[:start] + text[end:], encoding="utf-8")
          PY
          python3 scripts/apply-review-fixes.py
          git checkout HEAD -- scripts/apply-review-fixes.py .github/workflows/apply-review-fixes.yml

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Record exact source files
        run: |
          rm -f pnpm-lock.yaml
          mkdir -p review-diagnostics
          {
            git diff --name-only --diff-filter=ACM -z
            git ls-files --others --exclude-standard -z
          } | grep -zv '^review-diagnostics/' | tr '\0' '\n' > review-diagnostics/fixed-files.txt

      - name: Run API tests
        run: pnpm --filter @workspace/api-server test

      - name: Run site tests
        run: pnpm --filter awdp-site test

      - name: Run SSR tests
        run: node --test artifacts/awdp-site/tests/ssr-route.test.mjs

      - name: Build API
        run: pnpm --filter @workspace/api-server build

      - name: Build site
        run: pnpm --filter awdp-site build

      - name: Create detached verified commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          parent_sha=$(git rev-parse HEAD)
          base_tree_sha=$(git rev-parse 'HEAD^{tree}')
          entries_file=$(mktemp)

          while IFS= read -r file; do
            [ -n "$file" ] || continue
            encoded=$(base64 -w0 "$file")
            blob_sha=$(
              jq -n --arg content "$encoded" '{content:$content, encoding:"base64"}' |
                gh api --method POST "repos/${GITHUB_REPOSITORY}/git/blobs" --input - --jq '.sha'
            )
            jq -n --arg path "$file" --arg sha "$blob_sha" \
              '{path:$path, mode:"100644", type:"blob", sha:$sha}' >> "$entries_file"
          done < review-diagnostics/fixed-files.txt

          jq -n '{path:".github/workflows/apply-review-fixes.yml", mode:"100644", type:"blob", sha:null}' >> "$entries_file"
          jq -n '{path:"scripts/apply-review-fixes.py", mode:"100644", type:"blob", sha:null}' >> "$entries_file"

          tree_sha=$(
            jq -s --arg base_tree "$base_tree_sha" '{base_tree:$base_tree, tree:.}' "$entries_file" |
              gh api --method POST "repos/${GITHUB_REPOSITORY}/git/trees" --input - --jq '.sha'
          )
          commit_sha=$(
            jq -n \
              --arg message "fix: resolve review findings" \
              --arg tree "$tree_sha" \
              --arg parent "$parent_sha" \
              '{message:$message, tree:$tree, parents:[$parent]}' |
              gh api --method POST "repos/${GITHUB_REPOSITORY}/git/commits" --input - --jq '.sha'
          )

          printf '%s\n' "$parent_sha" > review-diagnostics/parent-sha.txt
          printf '%s\n' "$base_tree_sha" > review-diagnostics/base-tree-sha.txt
          printf '%s\n' "$tree_sha" > review-diagnostics/verified-tree-sha.txt
          printf '%s\n' "$commit_sha" > review-diagnostics/verified-commit-sha.txt

      - name: Upload verified commit metadata
        uses: actions/upload-artifact@v4
        with:
          name: review-verified-commit
          path: review-diagnostics
          if-no-files-found: error
          retention-days: 7
