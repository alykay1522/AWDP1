name: Apply review fixes

on:
  pull_request:
    branches:
      - fix/remove-pnpm-lockfile
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out fix branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm

      - name: Apply reviewed fixes
        id: apply
        continue-on-error: true
        run: |
          mkdir -p review-diagnostics
          python3 - <<'PY'
          from pathlib import Path
          script = Path("scripts/apply-review-fixes.py")
          text = script.read_text(encoding="utf-8")
          marker = "# Encode route params in the generated metadata fetcher too."
          if marker in text:
              start = text.index(marker)
              end = text.index("# Self-remove the one-shot automation files before committing.", start)
              script.write_text(text[:start] + text[end:], encoding="utf-8")
          PY
          set +e
          python3 scripts/apply-review-fixes.py 2>&1 | tee review-diagnostics/apply.log
          status=${PIPESTATUS[0]}
          echo "$status" > review-diagnostics/apply.exit-code
          git checkout HEAD -- scripts/apply-review-fixes.py .github/workflows/apply-review-fixes.yml
          exit "$status"

      - name: Upload apply diagnostics
        if: steps.apply.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: review-apply-diagnostics
          path: review-diagnostics
          if-no-files-found: error
          retention-days: 7

      - name: Install dependencies
        if: steps.apply.outcome == 'success'
        run: pnpm install --no-frozen-lockfile

      - name: Archive exact fixed files
        if: steps.apply.outcome == 'success'
        run: |
          rm -f pnpm-lock.yaml
          {
            git diff --name-only --diff-filter=ACM -z
            git ls-files --others --exclude-standard -z
          } > /tmp/review-fixed-files.list
          tar --null -T /tmp/review-fixed-files.list -czf review-diagnostics/fixed-files.tar.gz
          tr '\0' '\n' < /tmp/review-fixed-files.list > review-diagnostics/fixed-files.txt

      - name: Capture validation output
        if: steps.apply.outcome == 'success'
        run: |
          set +e
          pnpm --filter @workspace/api-server test 2>&1 | tee review-diagnostics/api-tests.log
          echo "${PIPESTATUS[0]}" > review-diagnostics/api-tests.exit-code
          pnpm --filter awdp-site test 2>&1 | tee review-diagnostics/site-tests.log
          echo "${PIPESTATUS[0]}" > review-diagnostics/site-tests.exit-code
          node --test artifacts/awdp-site/tests/ssr-route.test.mjs 2>&1 | tee review-diagnostics/ssr-tests.log
          echo "${PIPESTATUS[0]}" > review-diagnostics/ssr-tests.exit-code
          pnpm --filter @workspace/api-server typecheck 2>&1 | tee review-diagnostics/api-typecheck.log
          echo "${PIPESTATUS[0]}" > review-diagnostics/api-typecheck.exit-code
          pnpm --filter awdp-site typecheck 2>&1 | tee review-diagnostics/site-typecheck.log
          echo "${PIPESTATUS[0]}" > review-diagnostics/site-typecheck.exit-code
          pnpm --filter @workspace/api-server build 2>&1 | tee review-diagnostics/api-build.log
          echo "${PIPESTATUS[0]}" > review-diagnostics/api-build.exit-code
          pnpm --filter awdp-site build 2>&1 | tee review-diagnostics/site-build.log
          echo "${PIPESTATUS[0]}" > review-diagnostics/site-build.exit-code
          exit 0

      - name: Upload fixed files and diagnostics
        if: steps.apply.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: review-fixed-files-and-diagnostics
          path: review-diagnostics
          if-no-files-found: error
          retention-days: 7
