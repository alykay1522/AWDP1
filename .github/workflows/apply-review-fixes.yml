name: Apply review fixes

on:
  pull_request:
    branches:
      - fix/remove-pnpm-lockfile
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out fix branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm

      - name: Apply reviewed fixes
        run: python3 scripts/apply-review-fixes.py

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Test API business logic
        run: pnpm --filter @workspace/api-server test

      - name: Test site shipping logic
        run: pnpm --filter awdp-site test

      - name: Test SSR handler
        run: node --test artifacts/awdp-site/tests/ssr-route.test.mjs

      - name: Typecheck API
        run: pnpm --filter @workspace/api-server typecheck

      - name: Typecheck site
        run: pnpm --filter awdp-site typecheck

      - name: Build API
        run: pnpm --filter @workspace/api-server build

      - name: Build site
        run: pnpm --filter awdp-site build

      - name: Commit fixes
        run: |
          rm -f pnpm-lock.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: resolve review findings"
          git push origin HEAD
