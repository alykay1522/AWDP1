name: Apply review fixes

on:
  pull_request:
    branches:
      - fix/remove-pnpm-lockfile
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out fix branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm

      - name: Apply reviewed fixes
        run: |
          python3 scripts/apply-review-fixes.py
          git checkout HEAD -- scripts/apply-review-fixes.py .github/workflows/apply-review-fixes.yml

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Capture validation output
        run: |
          mkdir -p review-diagnostics
          set +e
          pnpm --filter @workspace/api-server test 2>&1 | tee review-diagnostics/api-tests.log
          echo "${PIPESTATUS[0]}" > review-diagnostics/api-tests.exit-code
          pnpm --filter awdp-site test 2>&1 | tee review-diagnostics/site-tests.log
          echo "${PIPESTATUS[0]}" > review-diagnostics/site-tests.exit-code
          node --test artifacts/awdp-site/tests/ssr-route.test.mjs 2>&1 | tee review-diagnostics/ssr-tests.log
          echo "${PIPESTATUS[0]}" > review-diagnostics/ssr-tests.exit-code
          pnpm --filter @workspace/api-server typecheck 2>&1 | tee review-diagnostics/api-typecheck.log
          echo "${PIPESTATUS[0]}" > review-diagnostics/api-typecheck.exit-code
          pnpm --filter awdp-site typecheck 2>&1 | tee review-diagnostics/site-typecheck.log
          echo "${PIPESTATUS[0]}" > review-diagnostics/site-typecheck.exit-code
          pnpm --filter @workspace/api-server build 2>&1 | tee review-diagnostics/api-build.log
          echo "${PIPESTATUS[0]}" > review-diagnostics/api-build.exit-code
          pnpm --filter awdp-site build 2>&1 | tee review-diagnostics/site-build.log
          echo "${PIPESTATUS[0]}" > review-diagnostics/site-build.exit-code
          rm -f pnpm-lock.yaml
          git diff --binary > review-diagnostics/review-fixes.patch
          git status --short > review-diagnostics/git-status.txt
          exit 0

      - name: Upload patch and diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: review-fixes-and-diagnostics
          path: review-diagnostics
          if-no-files-found: error
          retention-days: 7
