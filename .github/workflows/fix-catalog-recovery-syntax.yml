name: Finalize catalog recovery syntax

on:
  push:
    branches: [fix/catalog-recovery-options]
    paths:
      - ".github/workflows/fix-catalog-recovery-syntax.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/catalog-recovery-options

      - name: Fix nullish fallback expressions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("artifacts/api-server/src/lib/catalogRecovery.ts")
          text = path.read_text()
          text = text.replace(
              'variantGroupId: hint?.group ?? text(record.variantGroupId) || null,',
              'variantGroupId: hint?.group ?? (text(record.variantGroupId) || null),',
          )
          text = text.replace(
              'variantLabel: hint?.label ?? text(record.variantLabel) || null,',
              'variantLabel: hint?.label ?? (text(record.variantLabel) || null),',
          )
          path.write_text(text)
          PY

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/api-server/src/lib/catalogRecovery.ts
          git commit -m "fix: correct catalog recovery fallbacks"
          git push origin HEAD:fix/catalog-recovery-options
