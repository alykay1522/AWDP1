name: Apply missing buttonVariants imports

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  fix-imports:
    if: github.event.issue.title == 'run: fix buttonVariants imports'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Add missing imports
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          paths = [
              Path("artifacts/awdp-site/src/pages/admin-products-list.tsx"),
              Path("artifacts/awdp-site/src/pages/admin-images.tsx"),
          ]
          old = 'import { Button } from "@/components/ui/button";'
          new = 'import { Button, buttonVariants } from "@/components/ui/button";'

          for path in paths:
              text = path.read_text(encoding="utf-8")
              if new in text:
                  continue
              if old not in text:
                  raise SystemExit(f"Expected import not found in {path}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/fix-button-variants.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/awdp-site/src/pages/admin-products-list.tsx \
                  artifacts/awdp-site/src/pages/admin-images.tsx \
                  .github/workflows/fix-button-variants.yml
          git commit -m "fix: import buttonVariants on admin product pages"
          git push origin HEAD:main

      - name: Close trigger issue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh issue close "$ISSUE_NUMBER" --comment "Applied the missing buttonVariants imports and removed the temporary workflow."
