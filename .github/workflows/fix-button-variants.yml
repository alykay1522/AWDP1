name: Apply missing buttonVariants imports

on:
  check_run:
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  fix-imports:
    if: github.event.check_run.check_suite.head_branch == 'fix/button-variants-imports'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/button-variants-imports
          fetch-depth: 0

      - name: Add missing imports
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          paths = [
              Path("artifacts/awdp-site/src/pages/admin-products-list.tsx"),
              Path("artifacts/awdp-site/src/pages/admin-images.tsx"),
          ]
          old = 'import { Button } from "@/components/ui/button";'
          new = 'import { Button, buttonVariants } from "@/components/ui/button";'

          for path in paths:
              text = path.read_text(encoding="utf-8")
              if new not in text:
                  if old not in text:
                      raise SystemExit(f"Expected import not found in {path}")
                  text = text.replace(old, new, 1)

              lines = text.splitlines()
              cleaned = []
              for index, line in enumerate(lines):
                  if index > 20 and "import { Button, buttonVariants }" in line and "@/components/ui/button" in line:
                      continue
                  cleaned.append(line)
              path.write_text("\n".join(cleaned) + "\n", encoding="utf-8")
          PY

      - name: Commit changes to pull request branch
        shell: bash
        run: |
          rm -f .github/fix-button-variants-trigger.txt
          rm -f .github/workflows/fix-button-variants.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/awdp-site/src/pages/admin-products-list.tsx \
                  artifacts/awdp-site/src/pages/admin-images.tsx \
                  .github/fix-button-variants-trigger.txt \
                  .github/workflows/fix-button-variants.yml
          git commit -m "fix: import buttonVariants on admin product pages"
          git push origin HEAD:fix/button-variants-imports
