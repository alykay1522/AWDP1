name: Apply full-width header banner fix

on:
  push:
    branches:
      - fix/full-width-header-banner

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/full-width-header-banner

      - name: Update banner sizing
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("artifacts/awdp-site/src/components/layout.tsx")
          source = path.read_text()
          old = 'className="w-full h-auto max-h-24 sm:max-h-32 md:max-h-44 object-contain mx-auto block"'
          new = 'className="block w-full h-auto"'

          if old not in source:
              print("Banner sizing is already updated.")
              raise SystemExit(0)

          path.write_text(source.replace(old, new, 1))
          PY

      - name: Commit updated layout
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/awdp-site/src/components/layout.tsx
          git commit -m "fix: make header banner full width"
          git push origin HEAD:fix/full-width-header-banner
