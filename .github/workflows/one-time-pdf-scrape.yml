name: Wayback replay diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    if: github.head_ref == 'chatgpt/pdf-scrape-20260629'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests
      - name: Inspect Wayback replay responses
        run: python tools/diagnose_wayback.py
      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wayback-replay-diagnostic
          path: wayback_diagnostic/
          if-no-files-found: warn
          retention-days: 7
