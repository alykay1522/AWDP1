name: Deep historical PDF recovery

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  recover:
    if: github.head_ref == 'chatgpt/pdf-scrape-20260629'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Try every distinct historical capture
        run: python tools/recover_unresolved_historical.py
      - name: Upload historical recovery supplement
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allbrand-pdfs-historical-supplement
          path: |
            allbrandwindowdoorparts_pdfs_supplement.zip
            historical_recovery_output/historical_recovery_index.csv
            historical_recovery_output/historical_recovery_index.json
            historical_recovery_output/historical_recovery_summary.json
            historical_recovery_output/README.txt
          compression-level: 0
          retention-days: 7
