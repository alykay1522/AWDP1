name: Split recovered AllBrand PDFs

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  split:
    if: github.head_ref == 'chatgpt/pdf-scrape-20260629'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out splitter
        uses: actions/checkout@v4

      - name: Download recovered collection artifact
        uses: actions/download-artifact@v4
        with:
          name: allbrandwindowdoorparts-pdf-bulk-recovery
          path: source_artifact
          repository: alykay1522/AWDP1
          run-id: '28362625738'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Split into standalone ZIP files
        run: python tools/split_recovered_artifact.py

      - name: Upload part 1
        uses: actions/upload-artifact@v4
        with:
          name: allbrand-pdfs-part-1-of-4
          path: split_output/allbrandwindowdoorparts_pdfs_part_1_of_4.zip
          compression-level: 0
          retention-days: 7

      - name: Upload part 2
        uses: actions/upload-artifact@v4
        with:
          name: allbrand-pdfs-part-2-of-4
          path: split_output/allbrandwindowdoorparts_pdfs_part_2_of_4.zip
          compression-level: 0
          retention-days: 7

      - name: Upload part 3
        uses: actions/upload-artifact@v4
        with:
          name: allbrand-pdfs-part-3-of-4
          path: split_output/allbrandwindowdoorparts_pdfs_part_3_of_4.zip
          compression-level: 0
          retention-days: 7

      - name: Upload part 4
        uses: actions/upload-artifact@v4
        with:
          name: allbrand-pdfs-part-4-of-4
          path: split_output/allbrandwindowdoorparts_pdfs_part_4_of_4.zip
          compression-level: 0
          retention-days: 7

      - name: Upload indexes and manifests
        uses: actions/upload-artifact@v4
        with:
          name: allbrand-pdfs-indexes
          path: split_output/indexes/
          compression-level: 6
          retention-days: 7
