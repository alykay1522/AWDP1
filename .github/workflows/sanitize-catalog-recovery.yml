name: Purge catalog recovery files

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sanitize-catalog-recovery.yml"

permissions:
  contents: write

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Remove temporary and sensitive files
        shell: bash
        run: |
          rm -f .env.local
          rm -f .github/workflows/apply-catalog-dedup-options.yml
          rm -f artifacts/api-server/src/lib/catalogSeed.ts
          rm -f artifacts/api-server/src/data/catalogSeed0.json
          rm -f artifacts/api-server/src/data/catalogSeed1.json
          rm -f artifacts/api-server/src/data/catalogSeed2.json
          rm -f artifacts/api-server/src/data/catalogSeed3.json
          rm -f artifacts/api-server/src/data/catalogSeed4.json
          rm -f artifacts/api-server/src/data/catalogSeed5a.json
          rm -f artifacts/api-server/src/data/catalogSeed5b.json
          rm -f artifacts/api-server/src/data/catalogSeedRest0.ts
          rm -f artifacts/api-server/src/data/catalogSeedRest1.ts
          rm -f artifacts/api-server/src/data/catalogRemainingSources.ts
          rm -f artifacts/api-server/src/data/catalogRemainingEncodedSources.ts
          grep -qxF '.env.local' .gitignore || printf '\n.env.local\n' >> .gitignore
          rm -f .github/workflows/sanitize-catalog-recovery.yml

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "security: purge recovery files and local environment values"
          git push origin HEAD:main

# Triggered after the catalog restoration completed.
