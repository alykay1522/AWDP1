kind = "web"
previewPath = "/"
title = "All Window Door Parts"
version = "1.0.0"
id = "artifacts/awdp-site"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20520

[services.development]
run = "pnpm --filter @workspace/awdp-site run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/awdp-site", "run", "build" ]
publicDir = "artifacts/awdp-site/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20520"
BASE_PATH = "/"
